function recognizeAPI(dataUrl){
  var base64=String(dataUrl||'').replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/,'');

    try{
      var xhr=new XMLHttpRequest();

        var j=null;try{j=JSON.parse(xhr.responseText)}catch(e){}

function cropSel(plots,cur){return'<select id="plotSel" style="width:100%;min-height:2.6rem;padding:.4rem .6rem;border:1px solid var(--line);border-radius:.7rem">'+plots.map(function(p){return'<option value="'+p.id+'"'+(p.id===cur?' selected':'')+'>'+esc(p.name)+' · '+esc(p.cropName)+'</option>'}).join('')+'</select>'}
function warnList(plot,ph){var r=DIS.filter(function(d){return d.crop===plot.cropId&&ph.bbch>=d.range[0]-6&&ph.bbch<=d.range[1]+6}).slice(0,3);return r.length?r.map(function(d,i){return'<div class="item"><div class="main"><div class="t">'+esc(d.name)+' <span class="tag '+(i?'o':'r')+'">'+(i?'关注':'重点')+'</span></div><div class="m">'+esc(d.sym)+'</div></div></div>'}).join(''):'<div class="empty">当前阶段暂无重点预警</div>'}
function preview(cid,sd){if(!sd)return'<p class="mut">选择作物和播种日期后自动推算。</p>';if(future(sd))return'<p class="bad">播种日期不能晚于今天</p>';var p=pheno({cropId:cid,sowDate:sd});return'<p><b class="ok">'+esc(p.crop)+' - '+esc(p.stage)+'</b>（BBCH '+p.bbch+'）</p><p class="mut">播种后 '+p.days+' 天 · 距'+esc(p.next)+' '+p.left+' 天 · RPDW '+p.rpdw+'</p>'}
function pageHead(t,back,chip){$('#head').innerHTML='<div class="topbar-left">'+(back?'<button class="back" data-nav="home">‹</button>':'')+'<h1>'+esc(t)+'<small>BBCH物候驱动 · 用药安全前置校验</small></h1></div>'+(chip?'<span class="chip">'+esc(chip)+'</span>':'')}
function tabs(r){if(r==='diagnose'){$('#tabs').innerHTML='';$('#tabs').style.display='none';return}$('#tabs').style.display='flex';var a=[['home','⌂','工作台'],['plots','▤','地块'],['ledger','▦','台账'],['profile','○','我的']];$('#tabs').innerHTML=a.map(function(x){return'<button data-nav="'+x[0]+'" class="'+(r===x[0]?'on':'')+'"><span style="font-size:1.1rem">'+x[1]+'</span><span>'+x[2]+'</span></button>'}).join('')}
function renderProfile(){var p=DB.profile()||{};return'<section class="card"><div class="title">个人信息 <span class="tag">本地存储</span></div><form id="pf"><div class="field"><label>姓名</label><input name="name" value="'+esc(p.name)+'" maxlength="20"></div><div class="field"><label>农场名称</label><input name="farm" value="'+esc(p.farm)+'" maxlength="30"></div><div class="field"><label>联系电话</label><input name="phone" type="tel" value="'+esc(p.phone)+'" maxlength="11"></div><button class="btn pri blk">保存信息</button></form></section><section class="card"><div class="title">管理入口</div><div class="row"><button class="btn sec" data-nav="plots">地块管理</button><button class="btn gho" data-nav="ledger">农事台账</button></div></section>'}
function mountProfile(){var f=$('#pf');if(!f)return;f.onsubmit=function(e){e.preventDefault();var n=val(f,'name'),ph=val(f,'phone');if(!n){toast('请填写姓名');return}if(ph&&!/^1\d{10}$/.test(ph)){toast('手机号格式不正确');return}DB.saveProfile({name:n,farm:val(f,'farm'),phone:ph});toast('已保存')}}
function renderPlots(){var ps=DB.plots(),cur=DB.curPlot(),ed=state.edit?DB.plot(state.edit):null;var list=ps.length?ps.map(function(p){var ph=pheno(p),on=cur&&cur.id===p.id;return'<div class="item '+(on?'on':'')+'"><div class="main"><div class="t">'+esc(p.name)+' '+(on?'<span class="tag">当前</span>':'')+'</div><div class="m">'+esc(ph.crop)+' · '+esc(p.variety||'未填品种')+' · '+p.area+'亩 · '+esc(p.sowDate)+'</div><div class="m ok">'+esc(ph.stage)+' BBCH '+ph.bbch+' · RPDW '+ph.rpdw+'</div></div><div class="ops"><button class="btn sm gho" data-a="sel" data-id="'+p.id+'">选中</button><button class="btn sm sec" data-a="ed" data-id="'+p.id+'">编辑</button><button class="btn sm dan" data-a="del" data-id="'+p.id+'">删除</button></div></div>'}).join(''):'<div class="empty"><div class="ico">▤</div><b>还没有地块</b><div>请先添加一个地块，系统按播种日期推算BBCH。</div><button class="btn pri" data-a="add">去添加地块</button></div>';return'<div class="bar"><div><b>共 '+ps.length+' 块地</b></div><button class="btn pri" data-a="add">'+(ed?'取消编辑':'新增地块')+'</button></div>'+list+'<section class="card" id="pfPanel" style="display:'+(ed?'block':'none')+'"><div class="title">'+(ed?'编辑地块':'新增地块')+'</div><form id="plf"><div class="field"><label>地块名称</label><input name="name" value="'+esc(ed&&ed.name)+'"></div><div class="field"><label>作物类型</label><select name="cropId">'+opts(ed?ed.cropId:'wheat')+'</select></div><div class="field"><label>品种</label><input name="variety" value="'+esc(ed&&ed.variety)+'"></div><div class="field"><label>播种日期</label><input name="sowDate" type="date" max="'+today()+'" value="'+esc(ed&&ed.sowDate)+'"></div><div class="field"><label>面积（亩）</label><input name="area" type="number" min="0.1" step="0.1" value="'+esc(ed&&ed.area)+'"></div><div id="pv">'+preview(ed?ed.cropId:'wheat',ed?ed.sowDate:'')+'</div><div class="row"><button type="button" class="btn sec" data-a="cancel">取消</button><button class="btn pri">'+(ed?'保存修改':'添加地块')+'</button></div></form></section>'}
function mountPlots(){var f=$('#plf'),panel=$('#pfPanel');function show(){panel.style.display='block'}function hide(){panel.style.display='none';state.edit=null;f.reset()}function pv(){$('#pv').innerHTML=preview(f.cropId.value,f.sowDate.value)}$$('[data-a="add"]').forEach(function(b){b.onclick=function(){if(state.edit){hide();return}state.edit=null;f.reset();show();pv()}});$$('[data-a="cancel"]').forEach(function(b){b.onclick=hide});$$('[data-a="sel"]').forEach(function(b){b.onclick=function(){DB.setCur(b.dataset.id);toast('已切换地块')}});$$('[data-a="ed"]').forEach(function(b){b.onclick=function(){state.edit=b.dataset.id;render();toast('已载入地块')}});$$('[data-a="del"]').forEach(function(b){b.onclick=function(){modal('删除地块','确定删除吗？',true,function(){DB.delPlot(b.dataset.id);toast('已删除')})}});f.cropId.onchange=pv;f.sowDate.onchange=pv;f.onsubmit=function(e){e.preventDefault();var n=val(f,'name'),sd=val(f,'sowDate'),ar=Number(val(f,'area'));if(!n||!sd||!(ar>0)){toast('请完整填写');return}if(future(sd)){toast('播种日期不能晚于今天');return}var d={name:n,cropId:f.cropId.value,variety:val(f,'variety'),sowDate:sd,area:ar};state.edit?DB.editPlot(state.edit,d):DB.addPlot(d);hide();toast('已保存')}}
function renderHome(){var ps=DB.plots();if(!ps.length)return'<div class="empty"><div class="ico">▤</div><b>还没有地块</b><div>请先添加一块地。</div><div class="row"><button class="btn pri" data-nav="plots">去添加地块</button><button class="btn sec" data-nav="ledger">查看台账</button></div></div>';var p=DB.curPlot()||ps[0],ph=pheno(p),pg=Math.min(100,Math.round(ph.days/250*100));return'<section class="card pheno"><div class="row"><div style="flex:1;min-width:0">'+cropSel(ps,p.id)+'</div><span class="tag">'+esc(ph.mode)+'</span></div><div class="stage">'+esc(ph.crop)+' - '+esc(ph.stage)+'</div><div class="mut">BBCH '+ph.bbch+' · '+esc(ph.desc)+'</div><div class="prog"><i style="width:'+pg+'%"></i></div><div class="kv"><div><span class="mut">距'+esc(ph.next)+'</span><b>'+ph.left+' 天</b></div><div><span class="mut">RPDW</span><b>'+ph.rpdw+'</b></div><div><span class="mut">播种后</span><b>'+ph.days+' 天</b></div></div></section><section class="card"><div class="title">快捷操作</div><div class="row"><button class="btn pri" id="camBtn">拍照诊断</button><button class="btn sec" id="albBtn">从相册选择</button><button class="btn gho" data-nav="ledger">我的台账</button></div><p class="mut">微信内如无法直接调相机，请用“从相册选择”。</p></section><section class="card"><div class="title">未来3天 · 防治窗口</div>'+warnList(p,ph)+'</section>'}
function mountHome(){var s=$('#plotSel');if(s)s.onchange=function(){DB.setCur(s.value);toast('已切换地块')};function pick(inp){var p=DB.curPlot(),file=inp.files&&inp.files[0];if(!p){toast('请先添加地块');return}if(!file)return;load(true,'读取图像…');var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var cv=document.createElement('canvas'),max=1280,ra=Math.min(1,max/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*ra));cv.height=Math.max(1,Math.round(im.height*ra));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);var url=cv.toDataURL('image/jpeg',.8);load(true,'AI 云端识别中…');recognizeAPI(url).then(function(r){var q={plotId:p.id,img:url,h:hash(url),ai:r};try{sessionStorage.setItem(PKEY,JSON.stringify(q))}catch(e){}state.pending=q;load(false);location.hash='#/diagnose'}).catch(function(e){load(false);modal('识别失败',e.message||'识别服务不可用',true,function(){})})};im.onerror=function(){load(false);toast('图片解析失败')};im.src=fr.result};fr.onerror=function(){load(false);toast('图片读取失败')};fr.readAsDataURL(file);inp.value=''}var cb=$('#camBtn'),ab=$('#albBtn'),cam=$('#cam'),alb=$('#alb');if(cb)cb.onclick=function(){cam.click()};if(ab)ab.onclick=function(){alb.click()};cam.onchange=function(){pick(cam)};alb.onchange=function(){pick(alb)}}
function pending(){if(state.pending)return state.pending;try{return JSON.parse(sessionStorage.getItem(PKEY)||'null')}catch(e){return null}}
function renderDiagnose(){var q=pending();if(!q||!q.plotId)return'<div class="empty"><div class="ico">!</div><b>没有待诊断图片</b><button class="btn pri" data-nav="home">返回工作台</button></div>';var p=DB.plot(q.plotId);if(!p)return'<div class="empty"><b>地块不存在</b><button class="btn pri" data-nav="plots">去地块管理</button></div>';var ph=pheno(p,q.h);var ai=q.ai||null;var dis=ai?matchDis(ai.name,ai.confidence,p.cropId):null;var pre=dis?makePre(p.cropId,ph.bbch,dis):{list:[],alt:[],bad:false,warnings:[],safe:[]};state.last={p:p,ph:ph,dis:dis,pre:pre,q:q};return'<section class="card"><div class="title">本次诊断输入</div><img class="image-preview" style="width:100%;max-height:16rem;object-fit:cover;border-radius:.8rem" src="'+esc(q.img)+'"><div class="kv"><div><b>'+esc(p.name)+'</b></div><div><b>BBCH '+ph.bbch+'</b><div class="mut">'+esc(ph.stage)+'</div></div><div><b>RPDW '+ph.rpdw+'</b></div></div><p class="mut small">时间序列 '+ph.ts+' ｜ 单时相 '+ph.sp+' ｜ 噪声 '+ph.noise+'% ｜ 物候置信度 '+ph.conf+'%</p></section>'+(pre.bad?'<div class="warn"><b>用药安全警告：当前处于'+esc(ph.stage)+'，禁用该药，请改用替代方案</b><p class="mut">'+pre.warnings.map(esc).join('；')+'</p></div>':'')+'<section class="card"><div class="title">真实AI识别 <span class="tag">'+(dis?dis.confidence:0)+'%</span></div><div class="stage">'+esc(dis?dis.name:'未获取到识别结果')+'</div><div class="mut">'+esc(dis?(dis.confidence<50||dis.name.indexOf('非植物')>-1?'云端识别 · 结果置信度低或非植物，请换清晰的病害叶片照片重试':(dis.matched?'云端识别 · 已匹配本地处方库':'云端识别 · 未匹配本地处方库，仅供参考')):'请先用 python server.py 启动识别服务并配置密钥')+'</div></section><section class="card"><div class="title">系统推荐用药方案</div>'+(pre.list.length?pre.list.map(function(x){return'<div class="pest '+(x.bad?'no':'')+'"><div class="row"><div class="main" style="flex:1"><div class="t">'+esc(x.name)+'</div></div><span class="tag '+(x.bad?'r':x.cf?'o':'')+'">'+(x.bad?'生育期禁用':x.cf?'混配冲突':'可用')+'</span></div><div class="m mut">'+esc(x.type)+' ｜ 用量 '+esc(x.dose)+'</div><div class="m mut">'+esc(x.note)+'</div>'+(x.bad?'<div class="bad small">isForbidden = true，禁止使用</div>':'')+'</div>'}).join(''):'<div class="empty">暂无推荐</div>')+'</section>'+(pre.alt.length?'<section class="card alt"><div class="title">安全替代药</div>'+pre.alt.map(function(x){return'<div class="item"><div class="main"><b class="ok">'+esc(x.name)+'</b><div class="m">'+esc(x.dose)+' ｜ '+esc(x.note)+'</div></div></div>'}).join('')+'</section>':'')+'<section class="card"><button class="btn pri blk" id="recBtn">记录到台账</button></section>'}
function mountDiagnose(){var d=state.last;if(!d)return;var k=d.p.id+'_'+d.ph.bbch+'_'+(d.dis?d.dis.id:'');if(d.pre.bad&&state.warned!==k){state.warned=k;modal('用药安全警告','当前处于'+d.ph.stage+'，禁用该药，请改用替代方案',true,function(){})}var b=$('#recBtn');if(b)b.onclick=function(){var ids=d.pre.safe;if(!ids.length){toast('没有安全药剂');return}var names=ids.map(function(id){var x=PEST.filter(function(y){return y.id===id})[0];return x?x.name:id}).join('、');DB.addRec({plotId:d.p.id,action:'打药',name:names,date:today(),note:(d.dis?d.dis.name:'')+' · BBCH '+d.ph.bbch});DB.addDia({plotId:d.p.id,cropId:d.p.cropId,bbch:d.ph.bbch,disease:d.dis?d.dis.name:'',conf:d.dis?d.dis.confidence:0,recs:d.pre.list.map(function(x){return x.id}),safety:{bad:d.pre.bad,warnings:d.pre.warnings}});toast('已记录到台账');location.hash='#/ledger'}}
function renderLedger(){var rs=DB.records(),ps=DB.plots(),e=esc;return'<div class="bar"><div><b>共 '+rs.length+' 条记录</b></div><button class="btn pri" data-a="add">新增记录</button></div>'+(rs.length?rs.map(function(r){var p=DB.plot(r.plotId);return'<div class="item"><div class="main"><div class="t"><span class="tag">'+(r.action||'')+'</span> '+e(r.name)+'</div><div class="m">'+e(p?p.name:'已删除地块')+' ｜ '+e(r.date)+'</div>'+(r.note?'<div class="m">'+e(r.note)+'</div>':'')+'</div><div class="ops"><button class="btn sm dan" data-a="delr" data-id="'+r.id+'">删除</button></div></div>'}).join(''):'<div class="empty"><div class="ico">▦</div><b>台账还是空的</b><div>诊断记录或手动新增。</div><button class="btn pri" data-a="add">手动新增记录</button></div>')+'<section class="card" id="recPanel" style="display:none"><div class="title">手动新增记录</div>'+(ps.length?'<form id="rf"><div class="field"><label>地块</label><select name="plotId">'+ps.map(function(p){return'<option value="'+p.id+'">'+e(p.name)+'</option>'}).join('')+'</select></div><div class="field"><label>操作类型</label><select name="action"><option>打药</option><option>施肥</option></select></div><div class="field"><label>用药/用肥名称</label><input name="name"></div><div class="field"><label>日期</label><input name="date" type="date" max="'+today()+'" value="'+today()+'"></div><div class="field"><label>备注</label><textarea name="note"></textarea></div><div class="row"><button type="button" class="btn sec" data-a="cancel">取消</button><button class="btn pri">保存记录</button></div></form>':'<p class="bad">请先添加地块</p><button class="btn pri" data-nav="plots">去添加地块</button>')+'</section>'}
function mountLedger(){var p=$('#recPanel'),f=$('#rf');$$('[data-a="add"]').forEach(function(b){b.onclick=function(){p.style.display='block'}});$$('[data-a="cancel"]').forEach(function(b){b.onclick=function(){p.style.display='none'}});$$('[data-a="delr"]').forEach(function(b){b.onclick=function(){modal('删除记录','确定删除吗？',true,function(){DB.delRec(b.dataset.id);toast('已删除')})}});if(!f)return;f.onsubmit=function(e){e.preventDefault();var n=val(f,'name'),dt=val(f,'date');if(!n||!dt){toast('请完整填写');return}if(future(dt)){toast('日期不能晚于今天');return}DB.addRec({plotId:f.plotId.value,action:f.action.value,name:n,date:dt,note:val(f,'note')});f.reset();p.style.display='none';toast('已保存')}}
var ROUTES=['home','plots','ledger','profile','diagnose'];function route(){var r=(location.hash||'').replace(/^#\/?/,'').split('?')[0];return ROUTES.indexOf(r)>-1?r:'home'}
function render(){var r=route(),p=DB.curPlot();pageHead(r==='home'?'植保工作台':r==='plots'?'我的地块':r==='ledger'?'农事台账':r==='profile'?'我的':'诊断与决策',r==='diagnose',(r==='home'&&p)?'BBCH '+pheno(p).bbch+' · '+pheno(p).stage:(r==='diagnose'?'双模诊断':''));tabs(r);var html='',mount=null;if(r==='profile'){html=renderProfile();mount=mountProfile}else if(r==='plots'){html=renderPlots();mount=mountPlots}else if(r==='ledger'){html=renderLedger();mount=mountLedger}else if(r==='diagnose'){html=renderDiagnose();mount=mountDiagnose}else{html=renderHome();mount=mountHome}try{$('#page').innerHTML=html;if(mount)mount();scrollTo(0,0)}catch(err){$('#page').innerHTML='<div class="empty"><b>页面加载失败</b><div>'+esc(err.message||'')+'</div><button class="btn pri" data-nav="home">回到工作台</button></div>'}}
rerender=function(){setTimeout(render,0)};document.addEventListener('click',function(e){var t=closest(e.target,'[data-nav]');if(!t)return;e.preventDefault();var n=t.getAttribute('data-nav');if(ROUTES.indexOf(n)>-1)location.hash='#/'+n});w.onhashchange=render;w.addEventListener('storage',render);render();
